# En Obra smoke test (Maestro)
# Run on an Android device or emulator with the app installed:
#   maestro test maestro/en-obra-smoke.yaml
# The flow never sends a WhatsApp message.

appId: com.coystan.enobra
---
- launchApp:
    clearState: true
- assertVisible: "En Obra"
- tapOn: "Crear mi primer trabajo"
- tapOn: "¿Qué vas a hacer?"
- inputText: "Jardín piloto"
- tapOn: "¿Para quién?"
- inputText: "Cliente Demo"
- tapOn: "Empezar trabajo"
- assertVisible: "Agregar primer material"
- tapOn: "Agregar primer material"
- tapOn:
    id: ".*nombre.*|Nombre del material|¿Qué material.*"
- inputText: "Tierra negra"
- tapOn: "Guardar material"
- assertVisible: "Tierra negra"
- tapOn: "Tierra negra"
# Optional supplier path varies by build; continue status change
- tapOn: "Por pedir"
- tapOn: "Pedido"
- tapOn: "Guardar"
- assertVisible: "Tierra negra"
- pressKey: Home
- launchApp
- assertVisible: "Tierra negra"
- tapOn: "Pedido"
- tapOn: "Recibido"
- tapOn: "Guardar"
- assertVisible: "Recibido"
# Client WhatsApp handoff — confirm sheet then cancel inside WhatsApp if opened
- tapOn: "Vista cliente"
- tapOn: "WhatsApp"
