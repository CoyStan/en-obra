name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Expo doctor
        run: npx expo-doctor

      - name: Expo public config
        run: npx expo config --type public

      # Prefer Android export smoke. If Expo CLI changes break android export,
      # fall back to web export and Metro bundle smoke.
      - name: Android export smoke
        run: |
          set -euo pipefail
          if npx expo export --platform android --output-dir /tmp/en-obra-android-export; then
            echo "Android export smoke passed."
          else
            echo "Android export failed; trying weaker smoke targets."
            npx expo export --platform web --output-dir /tmp/en-obra-web-export
            npx react-native bundle \
              --platform android \
              --dev false \
              --entry-file node_modules/expo/AppEntry.js \
              --bundle-output /tmp/en-obra-android.bundle \
              --assets-dest /tmp/en-obra-android-assets
          fi

      - name: Pilot Android honesty gate
        run: node ./bin/pilot-android-check.cjs

      - name: Dashboard build
        run: npm run build --workspace dashboard

      - name: Dashboard lint
        run: npm run lint --workspace dashboard

      - name: Company OS validate
        run: |
          if [ -x ./bin/company-os ]; then
            ./bin/company-os validate
          else
            echo "bin/company-os not found; skipping."
          fi
